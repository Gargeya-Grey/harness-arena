id: opencode-reasoning
description: >
  The reasoning suite (word problems, many with a trap answer) through OpenCode, two free models.
  Controlled: only the model differs. To compare other models, add
  targets (each model key must be in configs/models.yaml).
suite: reasoning
prompt: reasoning-final-answer
repeats: 3

targets:
  - model: beam-free
    harness: opencode
  - model: pulse-alpha-free
    harness: opencode

workdir: isolated
user_config: isolated
timeout_s: 300

evaluators:
  - id: final-answer
    version: "1"
    dimension: quality
