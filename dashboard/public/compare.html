<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Lab · Compare</title>
<meta name="description" content="Compare model configurations side by side: model, harness, harness version and reasoning effort.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/styles.css">
<script src="/boot.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app folded">
  <aside class="rail" id="rail" aria-label="Model Lab"></aside>

  <main class="main ws" id="main">
    <aside class="lineup" id="configs" aria-label="Lineup, configurations and boards">
      <button type="button" class="lineup-toggle" id="cfg-toggle" data-act="cfg-toggle" aria-expanded="false" aria-controls="cfg-body">Lineup</button>
      <div class="lineup-body" id="cfg-body">
        <section class="lu-sec tray-sec" aria-labelledby="tray-h">
          <div class="sect-label"><h2 id="tray-h">Lineup</h2><span class="sect-note num" id="tray-note"></span></div>
          <div id="tray"><div class="loading">Loading the selection.</div></div>
          <p class="lu-hint">Letters mark each configuration in every view. Drag to reorder.</p>
        </section>

        <section class="lu-sec" aria-labelledby="lu-cfg-h">
          <div class="sect-label"><h2 id="lu-cfg-h">Configurations</h2><span class="sect-note" id="cfg-count"></span></div>
          <input type="search" class="cfg-search" id="cfg-search" aria-label="Search configurations" placeholder="Search model, harness, effort" autocomplete="off">
          <div id="cfg-filters"></div>
          <div id="cfg-list"><div class="loading">Loading configurations.</div></div>
        </section>

        <section class="lu-sec" aria-labelledby="lu-board-h">
          <div class="sect-label"><h2 id="lu-board-h">Boards</h2></div>
          <div id="ctx-boards">
            <label class="sr" for="board-select">Saved boards</label>
            <select id="board-select" disabled><option>No boards</option></select>
          </div>
          <div class="lu-row">
            <button type="button" class="btn-quiet" id="board-save" data-act="board-form" disabled>Save current</button>
            <button type="button" class="btn-quiet" id="board-delete" data-act="board-delete" disabled>Delete</button>
          </div>
          <div id="board-extra"></div>
        </section>
      </div>
    </aside>

    <div class="ws-main">
      <header class="ws-head">
        <div class="ws-title">
          <h1>Compare</h1>
          <span class="ws-meta" id="ctx-label"></span>
        </div>
        <div class="ctx-pick">
          <label class="sr" for="ctx-select">Comparison context: suite, prompt, cases, repeats</label>
          <select id="ctx-select" disabled><option>Loading contexts</option></select>
        </div>
        <div class="bar-actions" id="ctx-actions">
          <button type="button" class="icon-btn" id="refresh" data-act="refresh" aria-label="Refresh data" title="Read the results folder again">
            <svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
          <button type="button" class="btn-quiet" id="export-btn" data-act="export-menu" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu" disabled>
            Export<svg class="i caret" aria-hidden="true"><use href="#i-down"/></svg>
          </button>
        </div>
      </header>

      <div class="ws-sub">
        <div class="views-scroll">
        <div class="seg views" id="view-tabs" role="group" aria-label="Views" style="--n:5">
          <span class="seg-knob" aria-hidden="true"></span>
          <button type="button" id="nav-overview" data-act="view" data-view="overview" aria-pressed="true">Overview</button>
          <button type="button" id="nav-answers" data-act="view" data-view="answers" aria-pressed="false">Answers</button>
          <button type="button" id="nav-charts" data-act="view" data-view="charts" aria-pressed="false">Charts</button>
          <button type="button" id="nav-runs" data-act="view" data-view="runs" aria-pressed="false">Runs</button>
          <button type="button" id="nav-review" data-act="view" data-view="review" aria-pressed="false">Review</button>
        </div>
        </div>
        <div class="ctx-badge" id="ctx-badge" aria-live="polite"><span class="badge">Loading</span></div>
      </div>

      <div class="view" id="view-overview">
        <div class="tiles" id="tiles" role="group" aria-label="Headline numbers"></div>
        <section class="sec" id="leaderboard" aria-labelledby="lb-h">
          <div class="sec-head">
            <div class="sec-title-row"><h2 id="lb-h">Leaderboard</h2><span class="sec-note" id="lb-note"></span></div>
            <div class="sec-tools">
              <button type="button" class="link-btn" data-act="export" data-kind="csv" data-fk="lb:csv">CSV</button>
              <button type="button" class="link-btn" data-act="export" data-kind="md" data-fk="lb:md">Copy Markdown</button>
            </div>
          </div>
          <div id="lb"><div class="loading">Loading the leaderboard.</div></div>
        </section>
        <div class="chart-grid" id="charts-body"></div>
      </div>

      <div class="view" id="view-answers" hidden>
        <section class="sec" id="answers" aria-labelledby="ans-h">
          <div class="sec-head"><div class="sec-title-row"><h2 id="ans-h">Answers</h2><span class="sec-note" id="ans-note"></span></div></div>
          <div id="ans"><div class="loading">Loading the answers.</div></div>
        </section>
      </div>

      <div class="view" id="view-charts" hidden>
        <div class="chart-grid" id="charts-all"></div>
      </div>

      <div class="view" id="view-runs" hidden>
        <section class="sec" id="runs-sec" aria-labelledby="runs-h">
          <div class="sec-head"><div class="sec-title-row"><h2 id="runs-h">Runs</h2><span class="sec-note" id="runs-note"></span></div></div>
          <div id="runs-body"><div class="loading">Loading the runs.</div></div>
        </section>
      </div>

      <div class="view" id="view-review" hidden>
        <section class="sec" id="review-sec" aria-labelledby="rev-h">
          <div class="sec-head"><div class="sec-title-row"><h2 id="rev-h">Human review</h2><span class="sec-note" id="rev-note"></span></div></div>
          <div id="rev-body"><div class="loading">Loading the ratings.</div></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="export-menu" id="export-menu" role="menu" aria-label="Export" hidden>
  <button type="button" class="export-item" role="menuitem" data-act="export" data-kind="md">Copy Markdown table</button>
  <button type="button" class="export-item" role="menuitem" data-act="export" data-kind="csv">Download CSV</button>
  <button type="button" class="export-item" role="menuitem" data-act="export" data-kind="json">Download JSON</button>
  <button type="button" class="export-item" role="menuitem" data-act="export" data-kind="png169">Share card 16:9 (PNG)</button>
  <button type="button" class="export-item" role="menuitem" data-act="export" data-kind="png11">Share card 1:1 (PNG)</button>
</div>

<div class="status" id="status" aria-hidden="true"></div>
<aside class="insp" id="inspector" role="dialog" aria-modal="false" aria-labelledby="insp-title" hidden></aside>
<dialog class="dlg" id="review" aria-labelledby="review-title"></dialog>
<div class="live" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
