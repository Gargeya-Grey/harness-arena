# Model registry. One key per model variant we test.
# model_key is the stable identifier used in results, scores, and reports.
# Never rename or repurpose a key; add a new one instead.
#
# Fields
#   provider, model      Exact provider snapshot or id. Pin snapshots where the provider offers them.
#   display_name         Label in the dashboard.
#   context_window       Tokens, for reference.
#   reasoning_effort     Optional default effort. An experiment target overrides it with
#                        effort: <level> or efforts: [<level>, ...]; each effort is its own run.
#   effort_levels        Verified supported levels; [] means verified unavailable control.
#   pinned               Optional, default true. false for an alias the provider can point at
#                        another model at any time (free tiers such as opencode/beam-free).
#                        The dashboard and the report mark such a configuration.
#   harness_models       Optional. The id a harness expects when it differs from `model`.
#                        OpenCode ids name the provider inside OpenCode: <provider>/<model>.
#   params               Decoding params. CLI harnesses cannot forward them, so each raw
#                        row lists them as "not applied"; they document intent only.
#   pricing              Optional. USD per 1M tokens, for an API-equivalent cost column.
#                        Leave it out for subscription or free models: cost shows as n/a.
#                        cache_read/cache_write default to the input rate when absent.
#
# Prices change. Each pricing entry says when and where it was read.

models:
  gpt-6.1-terra:
    provider: openai
    model: gpt-6.1-terra
    display_name: GPT-6.1 Terra
    # Listed by the signed-in Codex CLI model catalog on 2026-11-15.
    reasoning_effort: high
    effort_levels: [low, medium, high, xhigh, max, ultra] # Installed Codex catalog, 2026-11-15.
    params: {}

  deepseek-v4.1-flash-max:
    provider: deepseek
    model: deepseek/deepseek-v4.1-flash
    display_name: DeepSeek V4.1 Flash
    context_window: 1000000
    reasoning_effort: max
    params:
      temperature: 0
      max_tokens: 64
    pricing: # read 2026-10-21 from the first run's notes; verify
      input_per_1m: 0.15
      output_per_1m: 0.60
      cache_read_per_1m: 0.003

  claude-haiku-5.5:
    provider: anthropic
    model: claude-haiku-5-5
    display_name: Claude Haiku 5.5
    context_window: 1000000
    # https://platform.claude.com/docs/en/build-with-claude/effort, checked 2026-11-15.
    effort_levels: [low, medium, high, xhigh, max]
    # No temperature: this model rejects non-default sampling values.
    params:
      max_tokens: 1024
    pricing: # Anthropic list price for prompts up to 100K tokens, read 2026-10-21
      input_per_1m: 0.10
      output_per_1m: 0.50

  claude-opus-5.5:
    provider: anthropic
    model: claude-opus-5-5
    display_name: Claude Opus 5.5
    # The ladder's frontier reference (docs/difficulty.md, Calibration).
    # No pricing: not read from a source yet, so cost shows as n/a.
    params:
      max_tokens: 1024

  gpt-6-luna-low:
    provider: openai
    model: gpt-6-luna
    display_name: GPT-6 Luna
    harness_models:
      opencode: openai/gpt-6-luna # through the ChatGPT sign-in inside OpenCode
    reasoning_effort: low
    params: {}
    pricing: # secondary sources (pricing aggregators), read 2026-10-21; verify on openai.com
      input_per_1m: 0.10
      output_per_1m: 0.50
      cache_read_per_1m: 0.01

  gemini-3.8-flash:
    provider: google
    model: gemini-3.8-flash
    display_name: Gemini 3.8 Flash
    harness_models:
      command-code: google/gemini-3.8-flash
    params: {}
    pricing: # introductory rate until 2026-12-31 per secondary sources, read 2026-10-21; verify
      input_per_1m: 0.75
      output_per_1m: 3.75
      cache_read_per_1m: 0.075

  beam-free:
    provider: opencode
    model: opencode/beam-free
    display_name: Beam (free)
    effort_levels: [low, medium, high, xhigh, max] # OpenCode 2.3.0 model.list, 2026-11-15.
    pinned: false # a free alias; OpenCode can change the model behind it
    params: {}

  pulse-alpha-free:
    provider: opencode
    model: opencode/pulse-alpha-free
    pinned: false # a free alias; OpenCode can change the model behind it
    display_name: Pulse Alpha (free)
    params: {}
